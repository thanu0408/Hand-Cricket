<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand Cricket</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6e8, #d9e7ff, #e8d9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            text-align: center;
        }

        h1 {
            color: #573b8a;
            font-size: 42px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #705f7e;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255,255,255,0.9);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(80,60,100,0.15);
        }

        h2 {
            color: #49376b;
            margin-bottom: 25px;
        }

        .choice-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .choice {
            padding: 18px 35px;
            border-radius: 15px;
            font-size: 18px;
        }

        .bat {
            background: #ffc6d9;
            color: #70334d;
        }

        .bowl {
            background: #c7ddff;
            color: #31527e;
        }

        .choice:hover {
            transform: translateY(-3px);
        }

        .hidden {
            display: none;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .score {
            background: white;
            padding: 15px 30px;
            border-radius: 18px;
            min-width: 140px;
        }

        .score p {
            color: #725f82;
        }

        .score h2 {
            margin: 5px 0 0;
            font-size: 32px;
        }

        .vs {
            color: #775c91;
            font-weight: bold;
        }

        .info {
            background: rgba(255,255,255,0.8);
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 15px;
        }

        .info h2 {
            margin-bottom: 5px;
        }

        .info p {
            color: #75667f;
        }

        .computer {
            background: rgba(255,255,255,0.85);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .computer h3 {
            color: #543d73;
            margin-bottom: 10px;
        }

        .computer-number {
            width: 65px;
            height: 65px;
            margin: auto;
            background: #d8c9f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #684d91;
        }

        .result {
            background: #fff1b8;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 15px;
            color: #6d5728;
            font-weight: bold;
            min-height: 55px;
        }

        .human {
            background: rgba(255,255,255,0.85);
            padding: 20px;
            border-radius: 20px;
        }

        .human h3 {
            color: #543d73;
            margin-bottom: 8px;
        }

        .human p {
            color: #75667f;
            margin-bottom: 15px;
        }

        .numbers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: auto;
        }

        .number {
            height: 55px;
            border-radius: 14px;
            background: #d4e6ff;
            color: #385b88;
            font-size: 18px;
        }

        .number:hover {
            background: #b9d5ff;
            transform: scale(1.05);
        }

        .number:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .restart {
            margin-top: 15px;
            padding: 12px 22px;
            border-radius: 12px;
            background: #e4c9f5;
            color: #674482;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .choice-buttons {
                flex-direction: column;
            }

            .numbers {
                gap: 6px;
            }

            .number {
                height: 48px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏏 Hand Cricket</h1>
    <p class="subtitle">Human vs Computer</p>


    <!-- FIRST SCREEN -->

    <div id="startScreen" class="card">

        <h2>What do you want to do?</h2>

        <div class="choice-buttons">

            <button class="choice bat" onclick="chooseBat()">
                🏏 Bat
            </button>

            <button class="choice bowl" onclick="chooseBowl()">
                ⚾ Bowl
            </button>

        </div>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen" class="hidden">

        <div class="scoreboard">

            <div class="score">
                <p>You</p>
                <h2 id="playerScore">0</h2>
            </div>

            <div class="vs">VS</div>

            <div class="score">
                <p>Computer</p>
                <h2 id="computerScore">0</h2>
            </div>

        </div>


        <div class="info">

            <h2 id="inningsTitle">1st Innings</h2>

            <p id="roleText"></p>

        </div>


        <div class="computer">

            <h3>🤖 Computer</h3>

            <div class="computer-number" id="computerNumber">
                ?
            </div>

            <p>Computer's number is hidden</p>

        </div>


        <div class="result" id="result">
            Choose a number from 1 to 10
        </div>


        <div class="human">

            <h3>👤 You</h3>

            <p>Select your number</p>

            <div class="numbers">

                <button class="number" onclick="play(1)">1</button>
                <button class="number" onclick="play(2)">2</button>
                <button class="number" onclick="play(3)">3</button>
                <button class="number" onclick="play(4)">4</button>
                <button class="number" onclick="play(5)">5</button>

                <button class="number" onclick="play(6)">6</button>
                <button class="number" onclick="play(7)">7</button>
                <button class="number" onclick="play(8)">8</button>
                <button class="number" onclick="play(9)">9</button>
                <button class="number" onclick="play(10)">10</button>

            </div>

        </div>


        <button class="restart" onclick="restartGame()">
            🔄 Restart Game
        </button>

    </div>


    <!-- GAME OVER -->

    <div id="gameOverScreen" class="card hidden">

        <h2 id="winner"></h2>

        <p id="finalScore"></p>

        <br>

        <button class="choice bat" onclick="restartGame()">
            🎮 New Game
        </button>

    </div>

</div>


<script>

    // =========================
    // GAME VARIABLES
    // =========================

    let playerRole = "";

    let playerScore = 0;
    let computerScore = 0;

    let target = 0;

    let innings = 1;

    let gameOver = false;


    // =========================
    // PLAYER CHOOSES BAT
    // =========================

    function chooseBat() {

        playerRole = "bat";

        startGame();
    }


    // =========================
    // PLAYER CHOOSES BOWL
    // =========================

    function chooseBowl() {

        playerRole = "bowl";

        startGame();
    }


    // =========================
    // START GAME
    // =========================

    function startGame() {

        document.getElementById("startScreen")
            .classList.add("hidden");

        document.getElementById("gameScreen")
            .classList.remove("hidden");

        updateRole();

        updateScore();

    }


    // =========================
    // SHOW CURRENT ROLE
    // =========================

    function updateRole() {

        if (innings === 1) {

            document.getElementById("inningsTitle").innerText =
                "1st Innings 🏏";

            if (playerRole === "bat") {

                document.getElementById("roleText").innerText =
                    "You are batting";

            } else {

                document.getElementById("roleText").innerText =
                    "Computer is batting";
            }

        } else {

            document.getElementById("inningsTitle").innerText =
                "2nd Innings 🏏";

            if (playerRole === "bat") {

                document.getElementById("roleText").innerText =
                    "Computer is batting";

            } else {

                document.getElementById("roleText").innerText =
                    "You are batting";
            }
        }
    }


    // =========================
    // CHECK WHO IS BATTING
    // =========================

    function playerIsBatting() {

        if (innings === 1) {

            return playerRole === "bat";

        } else {

            return playerRole === "bowl";
        }
    }


    // =========================
    // PLAY ONE BALL
    // =========================

    function play(playerNumber) {

        if (gameOver) {
            return;
        }


        // Computer chooses independently
        // when player locks their choice.

        let computerNumber =
            Math.floor(Math.random() * 10) + 1;


        // Show computer number AFTER
        // player's selection.

        document.getElementById("computerNumber")
            .innerText = computerNumber;


        // Disable buttons temporarily.

        disableButtons();


        // =========================
        // SAME NUMBER = OUT
        // =========================

        if (playerNumber === computerNumber) {

            document.getElementById("result").innerText =
                "Both chose " + playerNumber + "! WICKET! 🏏❌";


            setTimeout(function () {

                endInnings();

            }, 1000);

            return;
        }


        // =========================
        // DIFFERENT = RUNS
        // =========================

        if (playerIsBatting()) {

            // ADD to previous score.
            playerScore += playerNumber;

            document.getElementById("result").innerText =
                "You chose " + playerNumber +
                ". Computer chose " + computerNumber +
                ". You scored " + playerNumber + " run(s)! 🏏";

        } else {

            // ADD to previous score.
            computerScore += computerNumber;

            document.getElementById("result").innerText =
                "You chose " + playerNumber +
                ". Computer chose " + computerNumber +
                ". Computer scored " + computerNumber + " run(s)! 🤖";
        }


        // IMPORTANT:
        // Update TOTAL score.

        updateScore();


        // Check target during second innings.

        if (innings === 2) {

            checkTarget();

        } else {

            enableButtons();
        }

    }


    // =========================
    // UPDATE SCORE
    // =========================

    function updateScore() {

        document.getElementById("playerScore").innerText =
            playerScore;

        document.getElementById("computerScore").innerText =
            computerScore;
    }


    // =========================
    // END INNINGS
    // =========================

    function endInnings() {

        // FIRST INNINGS

        if (innings === 1) {

            if (playerRole === "bat") {

                target = playerScore + 1;

            } else {

                target = computerScore + 1;
            }


            innings = 2;


            document.getElementById("computerNumber")
                .innerText = "?";


            document.getElementById("result").innerText =
                "First innings over! Target = " +
                target + " runs 🎯";


            updateRole();


            setTimeout(function () {

                enableButtons();

            }, 1200);


        } else {

            // SECOND INNINGS

            finishGame();
        }

    }


    // =========================
    // CHECK TARGET
    // =========================

    function checkTarget() {

        let chasingScore;


        if (playerRole === "bat") {

            // Computer is chasing.

            chasingScore = computerScore;

        } else {

            // Player is chasing.

            chasingScore = playerScore;
        }


        if (chasingScore >= target) {

            finishGame();

        } else {

            enableButtons();
        }

    }


    // =========================
    // FINISH GAME
    // =========================

    function finishGame() {

        gameOver = true;


        document.getElementById("gameScreen")
            .classList.add("hidden");

        document.getElementById("gameOverScreen")
            .classList.remove("hidden");


        let winner = "";


        if (playerScore > computerScore) {

            winner = "🎉 You Win! 🏆";

        } else if (computerScore > playerScore) {

            winner = "🤖 Computer Wins!";

        } else {

            winner = "🤝 It's a Tie!";
        }


        document.getElementById("winner")
            .innerText = winner;


        document.getElementById("finalScore")
            .innerText =
            "Final Score: You " +
            playerScore +
            " - " +
            computerScore +
            " Computer";
    }


    // =========================
    // DISABLE BUTTONS
    // =========================

    function disableButtons() {

        let buttons =
            document.querySelectorAll(".number");

        buttons.forEach(function(button) {

            button.disabled = true;

        });
    }


    // =========================
    // ENABLE BUTTONS
    // =========================

    function enableButtons() {

        if (gameOver) {
            return;
        }


        let buttons =
            document.querySelectorAll(".number");


        buttons.forEach(function(button) {

            button.disabled = false;

        });


        // Hide previous computer choice.

        document.getElementById("computerNumber")
            .innerText = "?";
    }


    // =========================
    // RESTART
    // =========================

    function restartGame() {

        location.reload();
    }

</script>

</body>
</html>
